version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/code/app

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/chess-live/src:/chess-live/src
      - ./frontend/chess-live/public:/chess-live/public
    depends_on:
      - backend